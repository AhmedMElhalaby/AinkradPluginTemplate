name: AinkradPluginTemplate
options:
  bundleIdPrefix: com.example
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
packages:
  AinkradAppKit:
    # TEMPORARY LOCAL OVERRIDE — settings UX overhaul (feat/settings-catalog).
    # The settingsCatalog(host:) example below needs SettingsPage/SettingsPath,
    # which land in AinkradAppKit on this branch. The pinned revision predates
    # them, so the template cannot build against it.
    # BEFORE MERGE: AinkradAppKit merges to its development first, then this
    # block reverts to `url:` + `revision:` pinned at that merge commit. The
    # host's project.yml carries the same override and the same obligation.
    path: /Users/ahmedmelhalaby/Home/Projects/Ainkrad/AinkradAppKit
    # url: https://github.com/AhmedMElhalaby/AinkradAppKit
    # revision: d5d994bdd8e79d530410a1c370657fa593fa4ce6
targets:
  TemplatePlugin:
    type: bundle
    platform: macOS
    sources: [Sources/Plugin]
    dependencies:
      # AinkradAppKit is the ONLY shared dependency: dynamic + NOT embedded, so
      # the host's copy is used at runtime and protocol casts succeed. Any other
      # runtime dependency must be statically linked (see README).
      - package: AinkradAppKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.plugin.myplugin
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Plugin/Info.plist
        MACH_O_TYPE: mh_bundle
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    postBuildScripts:
      # Generate AinkradAPIVersion from the linked SDK rather than
      # trusting the hand-typed value in Info.plist — see the script.
      - script: "\"$SRCROOT/scripts/stamp-api-version.sh\""
        name: Stamp AinkradAPIVersion
        # The plist is an INPUT, not an output: declaring it makes the build
        # system order this phase after the task that copies it into the
        # bundle. Without it the script races that copy and finds nothing.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        # No outputs, so keep it running every build: the linked SDK revision
        # can change generation without any source file changing.
        basedOnDependencyAnalysis: false
schemes:
  TemplatePlugin:
    build: { targets: { TemplatePlugin: all } }
